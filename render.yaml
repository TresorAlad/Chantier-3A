# Blueprint Render: API billetterie (Docker) + Postgres + disque pour medias/coffre.
# Deploy: Dashboard Render > New > Blueprint > connecter ce depot.
# Doc pas a pas: backend/docs/RENDER.md

# Postgres Render optionnel. Pour TDEV Festival, utiliser Neon (seed local) :
# ne pas lier CHANTIER3A_DATABASE_URL au Postgres Render via fromDatabase,
# sinon l API pointe vers une base vide distincte de Neon et les inscriptions semblent effacees.
#
# databases:
#   - name: chantier3a-db
#     databaseName: chantier3a
#     user: chantier3a
#     plan: basic-256mb

services:
  - type: web
    name: chantier3a-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz?db=1
    disk:
      name: chantier3a-api-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: CHANTIER3A_PYENV
        value: production
      - key: CHANTIER3A_DATA_DIR
        value: /srv/data
      - key: CHANTIER3A_MEDIA_DIR
        value: /srv/data/media
      # Obligatoire : URL pooler Neon (meme base que seed-festival local), PAS le Postgres Render vide.
      # Ex. postgresql://USER:PASS@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      - key: CHANTIER3A_DATABASE_URL
        sync: false
      - key: CHANTIER3A_BASE_URL
        sync: false
      - key: CHANTIER3A_KEY_PASSPHRASE
        sync: false
      - key: CHANTIER3A_SESSION_SECRET
        generateValue: true
      - key: CHANTIER3A_SECRET_KEY
        generateValue: true
      - key: CHANTIER3A_OAUTH_STATE_SECRET
        generateValue: true
      # Graine Ed25519 dediee aux snapshots hors ligne du mobile.
      # Generer localement avec : cd backend && python -m checkin.signing
      - key: CHECKIN_SNAPSHOT_SIGNING_KEY
        sync: false
      - key: CHANTIER3A_PAYMENT_PROVIDERS
        value: manual
      - key: CHANTIER3A_PUBLIC_SIGNUP
        value: "0"
      # Ne jamais activer en prod (refuse le demarrage si CHANTIER3A_PYENV=production)
      - key: CHANTIER3A_DEMO
        value: "0"
