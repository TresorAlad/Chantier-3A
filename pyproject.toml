[project]
name = "billetterie-backend"
version = "0.1.0"
description = "FastAPI ticketing backend (PostgreSQL / SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "python-ulid>=3.0.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "PyNaCl>=1.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
billetterie-api = "cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "config", "bootstrap", "spa"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "auth*",
    "events*",
    "http_layer*",
    "money*",
    "notify*",
    "orders*",
    "payments*",
    "scan*",
    "store*",
    "tickets*",
]
